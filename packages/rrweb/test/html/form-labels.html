<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>form fields</title>
    <style>
      label {
        display: block;
      }
    </style>
  </head>

  <body>
    <form>
      <label for="text">
        Text
        <input type="text" id="text" />
      </label>
      <label for="radio-on">
        radio
        <span>On</span>
        <input type="radio" id="radio-on" name="toggle" value="on" />
      </label>
      <label>
        Off
        <input type="radio" name="toggle" value="off" checked />
      </label>
      <label for="checkbox">
        <span>Checkbox</span>
        <input type="checkbox" id="checkbox" />
      </label>
      <label for="textarea">
        Textarea
        <textarea name="" id="textarea" cols="30" rows="10" data-unmask-example="true"></textarea>
      </label>
      <label for="select">
        Select
        <select name="" id="select">
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </label>
      <label for="password">
        Password
        <input type="password" id="password" />
      </label>
      <label>
        Prefilled textarea
        <textarea>pre value</textarea>
      </label>
    </form>
  </body>
</html>
