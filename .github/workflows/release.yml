name: Release

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:
    inputs:
      publish_chrome_extension:
        description: Build and publish the Chrome extension without an npm release
        required: true
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js lts/*
        uses: actions/setup-node@v3
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Limit Changesets GitHub changelog batch size
        run: node .github/scripts/patch-changesets-github-info.cjs

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn run release
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Chrome Extension
        if: steps.changesets.outputs.published == 'true' || inputs.publish_chrome_extension
        run: NODE_OPTIONS='--max-old-space-size=4096' DISABLE_WORKER_INLINING=true yarn turbo run prepublish --filter=@rrweb/web-extension

      - name: Publish Chrome Extension
        if: (steps.changesets.outputs.published == 'true' || inputs.publish_chrome_extension) && github.ref == 'refs/heads/main'
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source ./packages/web-extension/dist/chrome.zip
        env:
          EXTENSION_ID: 'pdaldeopoccdhlkabbkcjmecmmoninhe'
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: Publish Next Chrome Extension
        if: (steps.changesets.outputs.published == 'true' || inputs.publish_chrome_extension) && github.ref == 'refs/heads/next'
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source ./packages/web-extension/dist/chrome.zip
        env:
          EXTENSION_ID: ${{ secrets.NEXT_CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.NEXT_CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.NEXT_CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NEXT_CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.NEXT_CWS_REFRESH_TOKEN }}
